name: Go Bottom-Up Integration CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/clone-go@v5
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Bottom-Up Tests
        run: go test -v ./...
